name: Daily briefing

on:
  schedule:
    - cron: "47 6 * * *"
      timezone: "America/Toronto"
    - cron: "17 13,19 * * 1-5"
      timezone: "America/Toronto"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/series.json"
      - "scripts/generate_daily_briefing.py"
      - "scripts/collect_market_indices.py"
      - "scripts/collect_security_prices.py"
      - "scripts/collect_portfolio_exposures.py"
      - "scripts/collect_portfolio_earnings.py"
      - "scripts/collect_rate_odds.py"
      - "scripts/collect_yield_curves.py"
      - "scripts/collect_fear_greed.py"
      - "scripts/collect_polymarket.py"
      - "data/securities.json"
      - "data/portfolio-exposures.json"
      - "data/earnings-highlights.json"
      - "tests/test_generate_daily_briefing.py"
      - "tests/test_market_indices.py"
      - "tests/test_portfolio_exposures.py"
      - "tests/test_portfolio_earnings.py"
      - "tests/test_rate_odds.py"
      - "tests/test_yield_curves.py"
      - "tests/test_fear_greed.py"
      - "tests/test_polymarket.py"
      - ".github/workflows/daily-briefing.yml"

permissions:
  contents: write

concurrency:
  group: macro-data-refresh
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify collector
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup Node for data validation
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Collect observations and generate statistical snapshot
        run: python scripts/generate_daily_briefing.py
      - name: Refresh CNN Fear and Greed Index
        run: python scripts/collect_fear_greed.py
      - name: Refresh open Polymarket events
        run: python scripts/collect_polymarket.py
      - name: Refresh world equity charts
        run: python scripts/collect_market_indices.py
      - name: Refresh security prices and USD/CAD
        run: python scripts/collect_security_prices.py
      - name: Refresh public portfolio exposures when due
        run: python scripts/collect_portfolio_exposures.py
      - name: Refresh weekly earnings for the public catalogue
        run: python scripts/collect_portfolio_earnings.py
      - name: Refresh next-decision market odds
        run: python scripts/collect_rate_odds.py
      - name: Refresh official US and Canadian yield curves
        run: python scripts/collect_yield_curves.py
      - name: Validate refreshed earnings before committing
        run: |
          node - <<'JS'
          const fs = require('node:fs'), F = require('./js/portfolio-analytics-utils.js');
          F.normalizeEarnings(JSON.parse(fs.readFileSync('data/portfolio-earnings.json', 'utf8')), JSON.parse(fs.readFileSync('data/securities.json', 'utf8')));
          console.log('Refreshed earnings validated');
          JS
      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro-data.json data/macro-briefing.json data/market-indices.json data/security-prices.json data/portfolio-exposures.json data/portfolio-earnings.json data/rate-odds.json data/yield-curves.json data/fear-greed.json data/polymarket.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update macro observations and market prices"
          git pull --rebase origin main
          git push origin HEAD:main

