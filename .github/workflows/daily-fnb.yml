name: Daily FNB performance

on:
  schedule:
    - cron: "37 18,21 * * *"
      timezone: "America/Toronto"
    - cron: "47 7 * * *"
      timezone: "America/Toronto"
    - cron: "17 6 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
  workflow_run:
    workflows: ["Monthly FNB optimization"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-fnb.yml
      - scripts/daily_fnb.py
      - scripts/common_fnb.py
      - scripts/robust_fnb.py
      - scripts/recommended_fnb.py
      - scripts/prospective_portfolios.py
      - scripts/benchmark_fnb.py
      - scripts/collect_fnb_daily_risk.py
      - scripts/collect_fnb_stress.py
      - tests/test_fnb_stress.py
      - tests/test_fnb_daily_risk.py
      - data/fnb-robust/**
      - data/fnb-recommended/**
      - data/fnb-prospective/**
      - data/fnb-benchmarks/**

permissions:
  contents: write

concurrency:
  # Macro releases must not replace a pending daily performance retry.
  group: fnb-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify investment accounting and immutable history
        run: |
          python -m unittest discover -s tests -p 'test_daily_fnb.py' -v
          python -m unittest discover -s tests -p 'test_common_fnb.py' -v
          python -m unittest discover -s tests -p 'test_recommended_fnb.py' -v
          python -m unittest discover -s tests -p 'test_prospective_portfolios.py' -v
          python scripts/daily_fnb.py --check
      - name: Record completed sessions and register new monthly proposals
        id: collect
        continue-on-error: true
        run: python scripts/daily_fnb.py
      - name: Validate closing ledger
        if: steps.collect.outcome == 'success'
        run: python scripts/daily_fnb.py --check
      - name: Compare all registered allocations from 19 October 2026
        id: comparison
        continue-on-error: true
        run: python scripts/common_fnb.py
      - name: Validate common start and preserved source records
        if: steps.comparison.outcome == 'success'
        run: python scripts/common_fnb.py --check
      - name: Update historical one-session VaR and distribution shape
        id: daily_risk
        continue-on-error: true
        run: python scripts/collect_fnb_daily_risk.py
      - name: Refresh adaptive historical stress inputs
        continue-on-error: true
        run: python scripts/collect_fnb_stress.py
      - name: Validate the retained daily risk sample
        run: |
          python scripts/collect_fnb_daily_risk.py --check
          python scripts/collect_fnb_stress.py --check
      - name: Publish daily history without overwriting an accepted session
        env:
          OUTCOME: ${{ steps.collect.outcome }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/fnb-daily-risk.json ]; then git add data/fnb-daily-risk.json; fi
          if [ -f data/fnb-stress-history.json ]; then git add data/fnb-stress-history.json; fi
          if [ "$OUTCOME" = 'success' ]; then
            git add data/fnb-performance.json data/fnb-performance data/fnb-performance-status.json
            git diff --cached --name-only --diff-filter=MD -- data/fnb-performance/days/ | python -c 'import sys; p=sys.stdin.read().strip(); assert not p, "Refusing to rewrite daily investment history: " + p'
          else
            # New launch definitions can be pending while prices are late.
            # Existing accepted daily records and units remain untouched.
            git add data/fnb-performance/registry.json data/fnb-performance.json data/fnb-performance-status.json
            echo "::warning::Closing prices incomplete. Existing investments preserved; automatic retry scheduled."
          fi
          if [ "$COMPARISON_OUTCOME" = 'success' ]; then
            git add data/fnb-comparison.json data/fnb-comparison data/fnb-comparison-status.json
          else
            git add data/fnb-comparison-status.json
            echo "::warning::Common-start comparison pending; last validated comparison retained."
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record permanent daily FNB performance"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Require yesterday's completed session for every portfolio and benchmark
        run: python scripts/common_fnb.py --check-freshness
      - name: Performance summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path('data/fnb-performance-status.json').read_text())
          d=json.loads(Path('data/fnb-performance.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"SAVY permanent tracking: {s['status']}; closing session {d['as_of']}; {len(d['accounts'])} accounts. Existing units, allocations and accepted daily records preserved.\n")
              comparison=Path('data/fnb-comparison.json')
              if comparison.exists():
                  c=json.loads(comparison.read_text())
                  f.write(f"Common-start comparison: {c['inception']} through {c['as_of']}; {len(c['accounts'])} accounts, later additions explicitly simulated.\n")
          PY
