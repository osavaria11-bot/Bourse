name: Daily stock valuations

on:
  schedule:
    - cron: "47 18 * * 1-5"
      timezone: "America/Toronto"
    - cron: "17 21 * * 1-5"
      timezone: "America/Toronto"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-valuations.yml
      - scripts/collect_valuations.py
      - data/valuation-universe.json
      - tests/test_valuations.py

permissions:
  contents: write

concurrency:
  group: daily-stock-valuations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify consensus timing, EV and RSI calculations
        run: |
          python -m unittest discover -s tests -p test_valuations.py -v
          node --test tests/valuation-utils.test.cjs
      - name: Collect native closing prices using the retained dated consensus
        id: collect
        continue-on-error: true
        # MarketScreener rejects GitHub-hosted requests. The daily SAVY research
        # automation refreshes consensus through its authorized public access;
        # this independent runner never attempts to work around that rejection.
        run: python -u scripts/collect_valuations.py --quotes-only
      - name: Validate dated observations and explicit coverage
        run: python scripts/collect_valuations.py --check
      - name: Publish only the new valuation observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/valuations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: archive observed daily forward stock valuations"
          git pull --rebase origin main
          python scripts/collect_valuations.py --check
          git push origin HEAD:main
      - name: Require a newly collected closing price or consensus
        if: steps.collect.outcome != 'success'
        run: |
          echo "::error::No closing prices or consensus collected; retained inputs keep their original dates."
          exit 1
