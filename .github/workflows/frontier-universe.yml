name: Expanded FNB frontier sources

on:
  push:
    branches: ["main", "codex/fnb-universe-*"]
    paths:
      - "data/fnb-frontier-model.json"
      - "scripts/collect_frontier_universe.py"
      - "scripts/fnb_sources.py"
      - ".github/workflows/frontier-universe.yml"
  schedule:
    - cron: "55 7 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Collect dated issuer returns and underlying exposures
        run: python -m scripts.collect_frontier_universe
      - name: Install independent numerical verification
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-fnb.txt
      - name: Verify and render the extended laboratory
        run: |
          node --test tests/fnb-frontier-utils.test.cjs
          node scripts/check_frontier_solution.cjs | python scripts/check_frontier_solution.py
          python -m unittest discover -s tests -p "test_frontier_universe.py" -v
          node scripts/build_monthly_fnb.cjs
      - name: Preserve complete sourced extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fnb-frontier-universe.json reports/portefeuilles-fnb.html data/fnb-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish verified expanded FNB frontier universe"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
