name: Expanded FNB frontier sources

on:
  push:
    branches: ["main", "codex/fnb-universe-*"]
    paths:
      - "data/fnb-frontier-model.json"
      - "scripts/collect_frontier_universe.py"
      - "scripts/fnb_sources.py"
      - "scripts/build_frontier_monthly.cjs"
      - "js/fnb-frontier-utils.js"
      - "tests/frontier-monthly-utils.test.cjs"
      - ".github/workflows/frontier-universe.yml"
  schedule:
    - cron: "55 7 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
  workflow_run:
    workflows: ["Monthly FNB optimization"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: frontier-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Collect dated issuer returns and underlying exposures
        run: python -m scripts.collect_frontier_universe
      - name: Install independent numerical verification
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-fnb.txt
      - name: Verify and render the extended laboratory
        run: |
          node --test tests/fnb-frontier-utils.test.cjs tests/frontier-monthly-utils.test.cjs
          node scripts/check_frontier_solution.cjs | python scripts/check_frontier_solution.py
          python -m unittest discover -s tests -p "test_frontier_universe.py" -v
          node scripts/build_monthly_fnb.cjs
      - name: Archive efficient portfolios and comparable monthly changes
        run: |
          node scripts/build_frontier_monthly.cjs
          node scripts/build_frontier_monthly.cjs --check
      - name: Preserve complete sourced extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fnb-frontier-universe.json reports/portefeuilles-fnb.html data/fnb-analysis.json data/fnb-frontier-monthly.json data/fnb-frontier-history
          git diff --cached --name-only --diff-filter=M -- data/fnb-frontier-history/ | python -c 'import sys; paths=[p.strip() for p in sys.stdin if p.strip() and not p.strip().endswith("/index.json")]; assert not paths, "Refusing to overwrite frontier archives: " + str(paths)'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish verified expanded FNB frontier universe"
          # Another collector can advance main between the pull and push.
          # Rebase each retry; a real content conflict still stops the job.
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
          done
          echo "Unable to publish frontier sources after three non-force attempts" >&2
          exit 1
