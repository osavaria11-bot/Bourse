name: Intraday quotes

on:
  schedule:
    - cron: "2-57/5 * * * 1-5"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/intraday-quotes.yml"
      - "scripts/collect_intraday_quotes.py"
      - "scripts/extended_hours.py"
      - "scripts/publish_intraday_quotes.cjs"
      - "scripts/queue_intraday_refresh.cjs"
      - "js/intraday-utils.js"
      - "js/extended-hours-utils.js"
      - "data/securities.json"
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

# This queue never deploys Pages and never waits for a site build. Even a
# cancelled full build can wake the feed; each collection has its own checks.
concurrency:
  group: intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      collected_at: ${{ steps.collect.outputs.collected_at }}
      attempted_at: ${{ steps.clock.outputs.attempted_at }}
    steps:
      - name: Record this attempt for bounded retries even if setup fails
        id: clock
        run: echo "attempted_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check the quote collector and feed calculations
        run: |
          python -m unittest discover -s tests -p 'test_intraday_quotes.py' -v
          python -m unittest discover -s tests -p 'test_extended_hours.py' -v
          node --test tests/extended-hours-utils.test.cjs tests/intraday-utils.test.cjs tests/live-quote-utils.test.cjs tests/live-feed-utils.test.cjs tests/refresh-chain.test.cjs
      - name: Restore the independent last successful observations
        continue-on-error: true
        run: |
          curl --fail --location --max-time 15 --retry 1 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/savy-live-quotes/intraday-quotes.json?v=$GITHUB_RUN_ID" --output "$RUNNER_TEMP/previous-quotes.json"
          node -e 'const fs=require("node:fs"),I=require("./js/intraday-utils.js"),p=process.argv[1],d=JSON.parse(fs.readFileSync(p));if(!I.normalize(d).quotes.length)throw Error("Empty feed");fs.copyFileSync(p,"data/intraday-quotes.json")' "$RUNNER_TEMP/previous-quotes.json"
      - name: Collect and validate actual exchange quotes
        id: collect
        run: |
          echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python scripts/collect_intraday_quotes.py
          node scripts/validate_intraday_quotes.cjs
      - name: Publish only the public quote file on its independent branch
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/publish_intraday_quotes.cjs')({github, context, core});

  next:
    needs: refresh
    # Failed collectors also schedule a retry. New main commits do not stop
    # this chain, and GitHub's cron remains an independent recovery trigger.
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Continue the feed after five minutes, including after a failed collection
        uses: actions/github-script@v8
        env:
          COLLECTED_AT: ${{ needs.refresh.outputs.collected_at || needs.refresh.outputs.attempted_at }}
        with:
          script: |
            await require('./scripts/queue_intraday_refresh.cjs')({
              github, context, core,
              collectedAt: process.env.COLLECTED_AT || new Date().toISOString()
            });
