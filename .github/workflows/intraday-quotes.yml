name: Intraday quotes

on:
  schedule:
    # Explicit UTC schedule covers overseas, North American and FX sessions.
    # Actions may delay scheduled runs; the UI retains their dated history.
    - cron: "2-57/5 * * * 1-5"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  actions: read

# Quote orchestration has its own queue. A scheduled run whose source has not
# passed full validation must never displace a pending full Pages deployment.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('quotes-skipped-{0}', github.run_id) || format('intraday-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      ready: ${{ steps.validated.outputs.ready }}
      started_at: ${{ steps.commit.outputs.started_at }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Require the exact source to have passed full browser and collector validation
        id: validated
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'static.yml', head_sha: process.env.SOURCE_SHA,
              status: 'success', per_page: 5
            });
            const ready = data.workflow_runs.some(run => run.head_sha === process.env.SOURCE_SHA);
            core.setOutput('ready', ready ? 'true' : 'false');
            core.info(ready ? 'Exact source already validated.' : 'Waiting for full source validation; published site kept.');

  refresh:
    needs: source
    if: needs.source.outputs.ready == 'true'
    # Only a validated source joins the publication queue shared with the full
    # deployment, so quote-only runs cannot cancel a source validation run.
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check quote collector and financial calculations
        run: |
          python -m unittest discover -s tests -p 'test_intraday_quotes.py' -v
          python -m unittest discover -s tests -p 'test_fear_greed.py' -v
          npm test
      - name: Collect actual exchange quotes without touching daily histories
        id: collect
        run: |
          python scripts/collect_intraday_quotes.py
          python scripts/collect_fear_greed.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          stamp = json.loads(Path('data/intraday-quotes.json').read_text())['generated_at']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('collected_at=' + stamp + '\n')
          PY
      - name: Validate generated snapshots
        run: node scripts/validate_intraday_quotes.cjs
      - name: Restore narration for this exact public edition
        id: narration_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/briefing-audio.json
            data/audio
          key: briefing-audio-v2-${{ hashFiles('data/daily-briefing.json', 'js/briefing-audio-utils.js', 'scripts/generate_briefing_audio.py', 'scripts/requirements-audio.txt') }}
      - name: Generate or reuse natural Canadian French narration
        id: narration
        continue-on-error: true
        timeout-minutes: 7
        run: |
          if ! python scripts/generate_briefing_audio.py --reuse-only; then
            if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install --no-install-recommends -y ffmpeg
            fi
            python -m pip install --disable-pip-version-check -r scripts/requirements-audio.txt
            python scripts/generate_briefing_audio.py
          fi
      - name: Save the complete verified narration
        if: steps.narration.outcome == 'success' && steps.narration_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/briefing-audio.json
            data/audio
          key: ${{ steps.narration_cache.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v5
      - name: Package validated source and generated quote data
        run: |
          mkdir -p _site
          cp index.html 221.png 2121.png _site/
          cp -R css js data reports _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Continue the actual quote feed without depending only on cron delivery
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          COLLECTED_AT: ${{ steps.collect.outputs.collected_at || needs.source.outputs.started_at }}
        with:
          script: |
            await require('./scripts/queue_intraday_refresh.cjs')({
              github, context, core, sourceSha: process.env.SOURCE_SHA,
              collectedAt: process.env.COLLECTED_AT
            });

# Quote snapshots are generated deployment assets. They do not create
# hundreds of daily commits or change the official closing-price histories.

