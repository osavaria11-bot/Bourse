name: Market breadth

on:
  schedule:
    - cron: "45 7 * * *"
      timezone: "America/Toronto"
    - cron: "45 19 * * 1-5"
      timezone: "America/Toronto"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect_market_breadth.py"
      - "tests/test_market_breadth.py"
      - ".github/workflows/market-breadth.yml"

permissions:
  contents: write
concurrency:
  group: market-breadth-refresh
  cancel-in-progress: false
jobs:
  breadth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore verified ten-year breadth bootstrap
        id: seed
        run: echo "restored=$(python scripts/restore_breadth_seed.py)" >> "$GITHUB_OUTPUT"
      - name: Verify the universe, SMA counts and adjustment bridge
        run: python -m unittest discover -s tests -p 'test_market_breadth.py' -v
      - name: Check the completed-date cutoff
        id: due
        run: echo "due=$(python scripts/collect_market_breadth.py --due)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.due.outputs.due == 'true'
        with:
          path: .cache/market-breadth
          key: breadth-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: breadth-v1-${{ runner.os }}-
      - name: Collect disclosed constituents and adjusted closes
        if: steps.due.outputs.due == 'true'
        id: collect
        continue-on-error: true
        run: python scripts/collect_market_breadth.py --workers 16
      - name: Validate the published counts even if a source is late
        run: python scripts/collect_market_breadth.py --check
      - name: Save valid dated breadth and visible source status
        if: steps.due.outputs.due == 'true' || steps.seed.outputs.restored == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-breadth.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update dated market breadth and source coverage"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Summarize actual coverage
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path('data/market-breadth.json')
          if file.exists():
              data=json.loads(file.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  for market in data['markets']:
                      out.write(f"{market['name']}: {market['status']} · {market.get('latest_date')} · {market.get('error') or 'dated observations validated'}\n\n")
          PY
