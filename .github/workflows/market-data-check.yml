name: Verify equity index sources
on:
  push:
    branches: ["codex/indices-**"]
    paths:
      - "scripts/collect_market_indices.py"
      - "scripts/generate_daily_briefing.py"
      - ".github/workflows/market-data-check.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect and verify all five actual indices
        run: |
          python scripts/collect_market_indices.py
          python - <<'PY'
          import json
          data = json.load(open('data/market-indices.json'))
          assert data['coverage']['fresh'] == 5, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'])
          PY
      - name: Save verified observations on the improvement branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-indices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: seed verified equity index histories"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
