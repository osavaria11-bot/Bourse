name: Verify security price sources
on:
  push:
    branches: ["codex/portefeuille-**"]
    paths:
      - "scripts/collect_security_prices.py"
      - "scripts/collect_market_indices.py"
      - "data/securities.json"
      - ".github/workflows/security-data-check.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect and verify all prices and their currencies
        run: |
          python scripts/collect_security_prices.py
          python - <<'PY'
          import json
          data = json.load(open('data/security-prices.json'))
          assert data['coverage']['fresh'] == 34, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'])
          PY
      - name: Save verified public prices on the improvement branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/security-prices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: seed public equity and FX price histories"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
