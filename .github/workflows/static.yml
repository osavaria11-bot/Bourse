name: Deploy static content to Pages

on:
  push:
    branches: ["main", "codex/**"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily briefing"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Collector regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate sourced news edition
        run: python scripts/validate_news_briefing.py
      - name: Dashboard regression tests
        run: |
          node --check js/dashboard.js
          node --check js/macro-utils.js
          node --check js/portfolio-utils.js
          node --check js/portfolio.js
          npm test
      - name: Install browser test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction and mobile checks
        run: npm run test:browser
        env:
          SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/portefeuille-') && '1' || '' }}
      - name: Verify the actual published briefing and world market histories
        run: node tests/published-dashboard.cjs
        if: hashFiles('data/market-indices.json') != ''
        env:
          SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/indices-') && '1' || '' }}
      - name: Verify real FRED exports on the improvement branch
        if: startsWith(github.ref, 'refs/heads/codex/')
        run: |
          python scripts/generate_daily_briefing.py --output-dir "$RUNNER_TEMP/fred-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "fred-check/macro-data.json").read_text())
          print("Provider coverage:", data["coverage"])
          points = {p["id"]: p for p in data["series"]}
          for sid in ("DFF", "CPIAUCSL", "PCEPILFE", "GDPC1", "PAYEMS"):
              assert points[sid]["fetch_status"] == "fresh", f"Provider integration failed for {sid}"
              print(sid, points[sid]["date"], points[sid]["value"], points[sid]["unit"])
          PY
      - name: Verify world equity data sources on the improvement branch
        if: startsWith(github.ref, 'refs/heads/codex/indices-')
        run: |
          python scripts/collect_market_indices.py --output-dir "$RUNNER_TEMP/market-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "market-check/market-indices.json").read_text())
          assert data['coverage']['fresh'] == 5, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'])
          print('World markets verified:', data['coverage'])
          PY
      - name: Verify security prices and currency sources on the portfolio branch
        if: startsWith(github.ref, 'refs/heads/codex/portefeuille-')
        run: |
          python scripts/collect_security_prices.py --output-dir "$RUNNER_TEMP/securities-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "securities-check/security-prices.json").read_text())
          catalogue = json.loads(Path('data/securities.json').read_text())
          assert data['coverage']['fresh'] == len(catalogue['series']) + 1, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'] if p['id'] != 'SNDK')
          sandisk = next(p for p in data['series'] if p['id'] == 'SNDK')
          assert sandisk['quote_symbol'] == 'SNDK.TO' and sandisk['currency'] == 'CAD'
          assert len(sandisk['history']) >= 2  # This CDR was listed in May 2026.
          sandisk_us = next(p for p in data['series'] if p['id'] == 'SNDKUS')
          assert sandisk_us['quote_symbol'] == 'SNDK' and sandisk_us['currency'] == 'USD'
          print('Security histories and USD/CAD verified:', data['coverage'])
          PY

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html 221.png 2121.png _site/
          cp -R css js data _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

