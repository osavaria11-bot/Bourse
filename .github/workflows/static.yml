name: Deploy static content to Pages

on:
  push:
    branches: ["main", "codex/**"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily briefing", "Fresh macro releases", "Monthly FNB optimization", "Daily FNB performance", "Expanded FNB frontier sources", "Market breadth"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.ref }}
  # A new source supersedes an older build. Quote publication uses a separate
  # group, so it cannot cancel full validation of the current source.
  cancel-in-progress: true

jobs:
  validate:
    # A failed daily close still publishes its diagnostic status, so a stale
    # comparison must be visibly flagged on the site after normal validation.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Daily FNB performance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Restore verified ten-year breadth bootstrap
        run: python scripts/restore_breadth_seed.py
      - name: Prepare submitted ETF additions from repository sources
        run: python scripts/install_submitted_fnb.py
      - name: Collector regression tests
        # The recession source is the NY Fed's legacy XLS workbook.
        # Install the same pinned reader used by scheduled macro updates.
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-macro.txt -r scripts/requirements-fnb.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate sourced news edition
        run: python scripts/validate_news_briefing.py
      - name: Render dated frontier extension
        run: node scripts/build_monthly_fnb.cjs
      - name: Validate monthly FNB data and preserved histories
        run: |
          python scripts/monthly_fnb.py --check
          python scripts/daily_fnb.py --check
          python scripts/common_fnb.py --check
          python scripts/collect_market_breadth.py --check
          python scripts/collect_fnb_daily_risk.py --check
          python scripts/collect_fnb_stress.py --check
          node --check js/fnb-stress-utils.js
          node --check js/fnb-risk-utils.js
          node --check js/fnb-factor-utils.js
          node --check js/fnb-decision-utils.js
          node --check js/fnb-decision.js
          node --check js/fnb-forecast-utils.js
          node --check js/fnb-forecast-worker.js
          node --check js/fnb-forecast-ui.js
          node scripts/build_frontier_monthly.cjs --check
          node --check scripts/build_monthly_fnb.cjs
          node --check js/fnb-dashboard.js
          node --check js/fnb-performance.js
          node --check js/fnb-performance-utils.js
      - name: Dashboard regression tests
        run: |
          node --check js/portal-utils.js
          node --check js/portal.js
          node scripts/build_report_archive.cjs
          node --check js/dashboard.js
          node --check js/yield-curve-utils.js
          node --check js/yield-curves.js
          node --check js/briefing-audio-utils.js
          node --check js/briefing-audio.js
          node --check js/live-fx.js
          node --check js/live-quotes.js
          node --check js/intraday-utils.js
          node --check js/macro-utils.js
          node --check js/fear-greed-utils.js
          node --check js/fear-greed.js
          node --check js/polymarket-utils.js
          node --check js/polymarket.js
          node --check js/weekly-reports-utils.js
          node --check js/weekly-reports.js
          node --check js/portfolio-utils.js
          node --check js/portfolio-heatmap-utils.js
          node --check js/portfolio-intraday-utils.js
          node --check js/portfolio-exposure-utils.js
          node --check js/portfolio-analytics-utils.js
          node --check js/portfolio-profile-utils.js
          node --check js/portfolio.js
          npm test
          node scripts/check_frontier_solution.cjs | python scripts/check_frontier_solution.py
          node scripts/validate_weekly_reports.cjs
          node scripts/validate_polymarket.cjs
          node scripts/validate_intraday_quotes.cjs
          node - <<'JS'
          const fs = require('node:fs'), C = require('./js/yield-curve-utils.js');
          const data = C.normalize(JSON.parse(fs.readFileSync('data/yield-curves.json', 'utf8')));
          console.log('Validated sovereign yield curves:', data.countries.map(c => ({id: c.id, dates: c.history.length, latest: c.history.at(-1)?.[0], status: c.fetch_status})));
          JS
      - name: Validate dated earnings data and reviewed messages
        run: |
          python scripts/collect_portfolio_earnings.py --validate-reviewed
          node - <<'JS'
          const fs = require('node:fs'), F = require('./js/portfolio-analytics-utils.js');
          const catalog = JSON.parse(fs.readFileSync('data/securities.json', 'utf8'));
          const data = F.normalizeEarnings(JSON.parse(fs.readFileSync('data/portfolio-earnings.json', 'utf8')), catalog);
          if (Object.keys(data.instruments).length !== catalog.series.length) throw new Error('Incomplete earnings catalogue');
          console.log('Validated earnings catalogue:', data.coverage);
          JS
      - name: Install browser test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: |
          sudo python3 scripts/prepare_browser_apt.py
          node scripts/install_browser_test_dependencies.cjs
      - name: Browser interaction and mobile checks
        run: npm run test:browser
        env:
          PORTAL_WEBKIT: "1"
          SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/portefeuille-') && '1' || '' }}
          MACRO_SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/macro-') && '1' || '' }}
          HEATMAP_SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/heatmap-') && '1' || '' }}
          YIELD_SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/yield-') && '1' || '' }}
      - name: Verify the actual published briefing and world market histories
        run: node tests/published-dashboard.cjs
        if: hashFiles('data/market-indices.json') != ''
        env:
          SCREENSHOT_LOGS: ${{ startsWith(github.ref, 'refs/heads/codex/indices-') && '1' || '' }}
      - name: Verify actual intraday curves and currency data
        if: startsWith(github.ref, 'refs/heads/codex/macro-session-')
        run: |
          python scripts/collect_intraday_quotes.py --output-dir "$RUNNER_TEMP/intraday-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "intraday-check/intraday-quotes.json").read_text())
          quotes = {q['id']: q for q in data['quotes']}
          for sid in ('SPX', 'IXIC', 'TSX', 'FEQT', 'VBAL', 'VGRO', 'MSFTCDR', 'USDCAD'):
              q = quotes[sid]
              assert q['fetch_status'] == 'fresh' and len(q['intraday_history']) >= 2, sid
              print(sid, q['session_date'], 'actual session points:', len(q['intraday_history']))
          PY
      - name: Verify real FRED exports on the improvement branch
        if: startsWith(github.ref, 'refs/heads/codex/')
        run: |
          python scripts/generate_daily_briefing.py --output-dir "$RUNNER_TEMP/fred-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "fred-check/macro-data.json").read_text())
          print("Provider coverage:", data["coverage"])
          points = {p["id"]: p for p in data["series"]}
          for sid in ("DFEDTARL", "DFEDTARU", "CPIAUCSL", "DEXCAUS", "V39079", "PCEPILFE", "GDPC1", "PAYEMS", "UNRATE", "V2062815", "V41690973", "V108785715", "V108785714", "ICSA", "IC4WSA", "DFII10"):
              assert points[sid]["fetch_status"] == "fresh", f"Provider integration failed for {sid}"
              print(sid, points[sid]["date"], points[sid]["value"], points[sid]["unit"])
          policy = points['V39079']
          assert policy['provider'] == 'bank_of_canada' and policy['unit'] == '%'
          assert policy['source_url'].startswith('https://www.bankofcanada.ca/')
          assert len(policy['history']) > 2000
          canada_jobs = points['V2062815']
          assert canada_jobs['provider'] == 'statistics_canada' and canada_jobs['unit'] == '%'
          assert canada_jobs['source_url'].startswith('https://www150.statcan.gc.ca/')
          assert len(canada_jobs['history']) >= 120
          for sid in ('V41690973', 'V108785715', 'V108785714'):
              assert points[sid]['provider'] == 'statistics_canada' and len(points[sid]['history']) >= 118
          assert points['ICSA']['frequency'] == points['IC4WSA']['frequency'] == 'weekly'
          assert len(points['DFII10']['history']) > 2000
          PY
      - name: Verify world equity data sources on the improvement branch
        if: startsWith(github.ref, 'refs/heads/codex/indices-')
        run: |
          python scripts/collect_market_indices.py --output-dir "$RUNNER_TEMP/market-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "market-check/market-indices.json").read_text())
          assert data['coverage']['fresh'] == 6, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'])
          feqt = next(p for p in data['series'] if p['id'] == 'FEQT')
          assert feqt['quote_symbol'] == 'FEQT.NE' and feqt['currency'] == 'CAD'
          print('World markets verified:', data['coverage'])
          PY
      - name: Verify security prices and currency sources on the portfolio branch
        if: startsWith(github.ref, 'refs/heads/codex/portefeuille-')
        run: |
          python scripts/collect_security_prices.py --output-dir "$RUNNER_TEMP/securities-check"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "securities-check/security-prices.json").read_text())
          catalogue = json.loads(Path('data/securities.json').read_text())
          assert data['coverage']['fresh'] == len(catalogue['series']) + 1, data['errors']
          assert all(len(p['history']) > 200 for p in data['series'] if p['id'] != 'SNDK')
          sandisk = next(p for p in data['series'] if p['id'] == 'SNDK')
          assert sandisk['quote_symbol'] == 'SNDK.TO' and sandisk['currency'] == 'CAD'
          assert len(sandisk['history']) >= 2  # This CDR was listed in May 2026.
          sandisk_us = next(p for p in data['series'] if p['id'] == 'SNDKUS')
          assert sandisk_us['quote_symbol'] == 'SNDK' and sandisk_us['currency'] == 'USD'
          print('Security histories and USD/CAD verified:', data['coverage'])
          PY

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Refresh exchange quotes, sentiment and Polymarket before publishing
        run: |
          python3 scripts/collect_fear_greed.py
          python3 scripts/collect_polymarket.py
          python3 scripts/collect_rate_odds.py
          python3 scripts/collect_yield_curves.py
          python3 scripts/refresh_interest_rates.py --published-baseline https://osavaria11-bot.github.io/Bourse/data/macro-data.json
          node scripts/validate_polymarket.cjs
      - name: Setup Python for natural narration
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Restore narration for this exact public edition
        id: narration_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/briefing-audio.json
            data/audio
          key: briefing-audio-v2-${{ hashFiles('data/daily-briefing.json', 'js/briefing-audio-utils.js', 'scripts/generate_briefing_audio.py', 'scripts/requirements-audio.txt') }}
      - name: Prepare natural narration dependencies
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if ! python scripts/generate_briefing_audio.py --reuse-only; then
            if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
              # Keep Ubuntu's signed packages, using its official archive.
              # A slow regional mirror must not consume the synthesis budget.
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              fi
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
            fi
            python -m pip install --disable-pip-version-check -r scripts/requirements-audio.txt
          fi
      - name: Generate or reuse natural Canadian French narration
        id: narration
        continue-on-error: true
        timeout-minutes: 7
        run: python scripts/generate_briefing_audio.py
      - name: Save the complete verified narration
        if: steps.narration.outcome == 'success' && steps.narration_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/briefing-audio.json
            data/audio
          key: ${{ steps.narration_cache.outputs.cache-primary-key }}
      - name: Collect and validate exchange quotes immediately before publication
        run: |
          python3 scripts/collect_intraday_quotes.py
          node scripts/validate_intraday_quotes.cjs
      - name: Check source is still current before publication
        id: current
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('publish', data.commit.sha === process.env.SOURCE_SHA ? 'true' : 'false');
      - name: Prepare static site
        if: steps.current.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp index.html 221.png 2121.png _site/
          python3 scripts/restore_breadth_seed.py
          python3 scripts/install_submitted_fnb.py
          node scripts/build_monthly_fnb.cjs
          node scripts/build_report_archive.cjs
          cp -R css js data reports _site/
      - name: Upload site
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4


